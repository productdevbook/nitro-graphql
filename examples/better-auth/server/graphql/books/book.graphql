type Book {
  id: ID!
  title: String!
  author: String!
  isbn: String
  description: String
  publishedYear: String
  createdAt: Timestamp!
  updatedAt: Timestamp!
  isAvailable: Boolean!
  # The user who owns this book
  owner: User!
}

input CreateBookInput {
  title: String!
  author: String!
  isbn: String
  description: String
  publishedYear: String
}

input UpdateBookInput {
  title: String
  author: String
  isbn: String
  description: String
  publishedYear: String
}

extend type Query {
  # Get all books
  books: [Book!]!

  # Get a single book by ID
  book(id: ID!): Book
}

extend type Mutation {
  # Create a new book (requires authentication)
  createBook(input: CreateBookInput!): Book! @auth

  # Update an existing book (requires authentication and ownership)
  updateBook(id: ID!, input: UpdateBookInput!): Book @auth

  # Delete a book (requires authentication and ownership)
  deleteBook(id: ID!): Boolean! @auth
}

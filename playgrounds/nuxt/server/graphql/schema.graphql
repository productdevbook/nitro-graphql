scalar DateTime
scalar JSON

type Query {
  hello: String!
  greeting(name: String!): String!
}

type Mutation {
  _empty: String
}

type Subscription {
  """Simple counter that increments every second"""
  countdown(from: Int!): Int!

  """Receives a greeting message every 2 seconds"""
  greetings: String!

  """Current server time updated every second"""
  serverTime: DateTime!
}
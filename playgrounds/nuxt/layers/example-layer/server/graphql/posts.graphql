# Layer GraphQL Schema - Posts
type Post {
  id: ID!
  title: String!
  content: String!
  author: String!
  createdAt: DateTime!
}

extend type Query {
  posts: [Post!]!
  post(id: ID!): Post
}

extend type Mutation {
  createPost(input: CreatePostInput!): Post!
  test101010: String!
}

input CreatePostInput {
  title: String!
  content: String!
  author: String!
}
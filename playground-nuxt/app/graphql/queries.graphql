query GetUsers {
  users {
    id
    name
    email
    createdAt
  }
}

query GetUser($id: ID!) {
  user(id: $id) {
    id
    name
    email
    createdAt
  }
}

query GetTodos {
  todos {
    id
    title
    completed
    createdAt
  }
}

query GetPosts {
  posts {
    id
    title
    content
    authorId
  }
}

query GetPostWithComments($postId: ID!) {
  post(id: $postId) {
    id
    title
    content
    authorId
  }
  comments(postId: $postId) {
    id
    content
    authorId
  }
}
scalar DateTime
scalar JSON

type Query {
  hello: String!
  greeting(name: String!): String!
  users: [User!]!
  user(id: ID!): User
  todos: [Todo!]!
  todo(id: ID!): Todo
}

type Todo {
  id: ID!
  title: String!
  completed: Boolean!
  createdAt: DateTime!
}

type User {
  id: ID!
  name: String!
  email: String!
  createdAt: DateTime!
}

input CreateUserInput {
  name: String!
  email: String!
}

type Mutation {
  addTodo(title: String!): Todo!
  toggleTodo(id: ID!): Todo!
  deleteTodo(id: ID!): Boolean!
  createUser(input: CreateUserInput!): User!
}
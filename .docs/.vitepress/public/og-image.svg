<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F0F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F0F0F;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6418;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#630ABB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00DC82;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6418;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#630ABB;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6418;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FF6418;stop-opacity:0" />
    </radialGradient>

    <!-- Pattern for background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow effects -->
  <ellipse cx="300" cy="315" rx="400" ry="400" fill="url(#glowGradient)"/>
  <ellipse cx="900" cy="315" rx="400" ry="400" fill="url(#glowGradient)" opacity="0.5"/>

  <!-- Logo - "N" with lightning bolt (larger size) -->
  <g transform="translate(150, 315) scale(1.8)">
    <!-- Main N shape -->
    <path fill="url(#accentGradient)" d="M30 30 L30 98 L38 98 L38 48 L90 98 L98 98 L98 30 L90 30 L90 80 L38 30 Z"/>

    <!-- Lightning bolt accent -->
    <path fill="#00DC82" opacity="0.9" d="M64 45 L58 60 L66 60 L60 75 L72 58 L64 58 L70 45 Z"/>
  </g>

  <!-- Main Title -->
  <text x="380" y="280" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="84" font-weight="700" fill="url(#textGradient)">
    Nitro GraphQL
  </text>

  <!-- Tagline -->
  <text x="380" y="350" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="32" font-weight="400" fill="#ffffff" opacity="0.8">
    The easiest way to add GraphQL to Nitro
  </text>

  <!-- Features -->
  <g transform="translate(380, 400)">
    <!-- Feature 1 -->
    <g>
      <circle cx="8" cy="-4" r="6" fill="#00DC82"/>
      <text x="25" y="0" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#ffffff" opacity="0.9">
        Auto-discovery
      </text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(220, 0)">
      <circle cx="8" cy="-4" r="6" fill="#630ABB"/>
      <text x="25" y="0" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#ffffff" opacity="0.9">
        Type Generation
      </text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(460, 0)">
      <circle cx="8" cy="-4" r="6" fill="#FF6418"/>
      <text x="25" y="0" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#ffffff" opacity="0.9">
        Zero Config
      </text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="380" y="520" width="680" height="4" fill="url(#accentGradient)" rx="2"/>

  <!-- Version badge -->
  <g transform="translate(380, 560)">
    <rect width="100" height="32" rx="16" fill="#FF6418" opacity="0.2" stroke="#FF6418" stroke-width="1"/>
    <text x="50" y="21" font-family="monospace" font-size="14" font-weight="600" fill="#FF6418" text-anchor="middle">
      v2.0.0
    </text>
  </g>

  <!-- GitHub link -->
  <text x="510" y="580" font-family="monospace" font-size="16" fill="#ffffff" opacity="0.5">
    github.com/productdevbook/nitro-graphql
  </text>

  <!-- Decorative elements -->
  <circle cx="1050" cy="150" r="4" fill="#FF6418" opacity="0.6"/>
  <circle cx="1100" cy="200" r="3" fill="#630ABB" opacity="0.6"/>
  <circle cx="1080" cy="250" r="5" fill="#00DC82" opacity="0.6"/>
  <circle cx="1120" cy="450" r="4" fill="#FF6418" opacity="0.4"/>
  <circle cx="1060" cy="500" r="3" fill="#630ABB" opacity="0.4"/>
</svg>
